services:
  typeracer-engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: martypolcic/console-typeracer:latest
    container_name: typeracer-engine
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "54897:54897"
    environment:
      - PORT=8080
      - TCP_PORT=54897
      - DEFAULT_MAX_PLAYERS=2
      # Configurable Connection Ruleset
      - LOBBY_TIMEOUT_MS=600000
      - TCP_COMMAND_TIMEOUT_MS=2500
      - TCP_KEEPALIVE_MS=15000
      - WS_HEARTBEAT_INTERVAL_MS=30000
      - ENGINE_HANDSHAKE_TIMEOUT_SEC=5
      - MAX_LOBBY_CAPACITY=4
      - FINISH_GRACE_TIMEOUT_SEC=20
      - RACE_MAX_DURATION_SEC=60
